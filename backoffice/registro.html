<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ProjectHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <h2>ProjectHub</h2>
                <p>Gestiona tus proyectos</p>
            </div>

            <div class="login-header">
                <h2>Crear cuenta</h2>
                <p>Regístrate para comenzar</p>
            </div>

            <form id="form-registro">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="itsonId">ID ITSON</label>
                    <input type="text" id="itsonId" placeholder="6 números, ej. 216578"
                        inputmode="numeric" pattern="\d{6}" maxlength="6" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" placeholder="Repite tu contraseña" required>
                </div>

                <p id="mensaje" class="form-message" hidden></p>

                <button type="submit" id="btn-registro" class="btn-login">
                    Registrarse
                </button>
            </form>

            <div class="register-link">
                <p>¿Ya tienes una cuenta?
                    <a href="index.html">Inicia sesión</a>
                </p>
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
