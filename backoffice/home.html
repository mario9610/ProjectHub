<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - ProjectHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="home-header">
        <h2>ProjectHub</h2>
        <a href="index.html">Cerrar sesión</a>
    </header>

    <main class="home-container">

        <section class="welcome">
            <h1>¡Bienvenido a ProjectHub!</h1>
            <p>Administra y organiza tus proyectos en un solo lugar.</p>
        </section>


        <section class="project-form">
            <h2>Registrar nuevo proyecto</h2>
            <p>Completa los siguientes datos para agregar un proyecto.</p>

            <form>
                <div class="form-group">
                    <label for="titulo">Nombre del proyecto</label>
                    <input type="text" id="titulo" placeholder="Ej. Sistema de inventario">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" placeholder="Describe tu proyecto..."></textarea>
                </div>

                <div class="form-group">
                    <label for="tecnologias">Tecnologías</label>
                    <input type="text" id="tecnologias" placeholder="Ej. Java, HTML, CSS, MySQL">
                </div>

                <div class="form-group">
                    <label for="repositorio">Repositorio</label>
                    <input type="url" id="repositorio" placeholder="https://github.com/usuario/proyecto">
                </div>

                <div class="form-group">
                    <label for="imagenes">Imágenes del proyecto</label>
                    <input type="file" id="imagenes" accept="image/*" multiple>
                </div>

                <button type="button" class="btn-project">
                    Guardar proyecto
                </button>
            </form>
        </section>

        <section class="projects">
            <h2>Mis proyectos</h2>

            <div class="projects-empty">
                <h3>Aún no tienes proyectos</h3>
                <p>Cuando agregues un proyecto, aparecerá aquí.</p>
            </div>
        </section>


    </main>

</body>

</html>
